services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quality_radar
      POSTGRES_USER: quality_radar
      POSTGRES_PASSWORD: quality_radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_radar -d quality_radar"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/quality_radar
      DATABASE_USERNAME: quality_radar
      DATABASE_PASSWORD: quality_radar
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/projects"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./frontend
    ports: ["4170:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
