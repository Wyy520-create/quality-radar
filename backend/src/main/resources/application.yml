spring:
  application:
    name: quality-radar
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quality_radar}
    username: ${DATABASE_USERNAME:quality_radar}
    password: ${DATABASE_PASSWORD:quality_radar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${SERVER_PORT:8080}
